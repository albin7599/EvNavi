name: ev_navi
description: "EV Route Optimizer & Charging Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Map & routing
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # HTTP
  http: ^1.2.2

  # GPS / location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Utilities
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  assets:
    - assets/icon/
